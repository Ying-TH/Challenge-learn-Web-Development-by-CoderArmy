<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./hwstyle.css">
</head>
<body>

    <!-- Flexbox -->
    <div class="text-1">FlexBox</div>
    <div class="flex-container">
        <div class="box-container box1">
            <div class="item-box1 item1"></div>
            <div class="item-box1 item2"></div>
        </div>
        <div class="box-container box2">
            <div class="item-box2 rowbox1">
                <div class="item-row item3"></div>
                <div class="item-row item4"></div>
            </div>
            <div class="item-box2 rowbox2">
                <div class="item-column columnbox1">
                    <div class="boxrow rows1">
                        <div class="boxfifth item5"></div>
                        <div class="boxfifth item6"></div>
                    </div>
                    <div class="boxrow rows2">
                        <div class="boxsixth item8"></div>
                        <div class="boxsixth item9"></div>
                    </div>
                </div>
                <div class="item-column columnbox2"></div>
            </div>
        </div>
    </div>

    <!-- Grid -->
    <div class="text-2">Grid</div>
    <div class="grid-container">
        <div class="box first"></div>
        <div class="box second"></div>
        <div class="box third"></div>
        <div class="box fourth"></div>
        <div class="box fifth"></div>
        <div class="box sixth"></div>
        <div class="box seventh"></div>
        <div class="box eighth"></div>
        <div class="box ninth"></div>
    </div>

    <br><br>
    
</body>
</html>
